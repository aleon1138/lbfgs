[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbfgs"
version = "0.4"
description = "L-BFGS / OWL-QN optimizer with Armijo, Hager-Zhang and Lewis-Overton line searches"
readme = "README.md"
authors = [
    { name = "Arnaldo Leon", email = "amleon@alum.mit.edu" },
]
requires-python = ">=3.10"
# numba 0.60 is the first release supporting NumPy 2.x.
dependencies = ["numpy>=1.24", "numba>=0.60"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["lbfgs*"]

[project.urls]
Source = "https://github.com/aleon1138/lbfgs"

[tool.pytest.ini_options]
# Prepend the repo root to sys.path so `import lbfgs` always resolves to this
# working tree, not to a copy installed in site-packages. Without this, a bare
# `pytest` (unlike `python -m pytest`, which adds the CWD) silently tests the
# installed package instead of the code under edit.
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
