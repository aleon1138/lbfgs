name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button to the Actions tab

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a failure in one cell does not cancel the others
      matrix:
        os: [ubuntu-latest, macos-latest] # OpenBLAS vs Accelerate numpy builds
        python: ["3.10", "3.14"] # oldest supported and newest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --extra test pytest -v

  # The oldest numpy and numba versions that pyproject.toml supports.
  oldest-deps:
    name: oldest deps (numpy 1.24, numba 0.60)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      # --no-project does not install lbfgs or the latest versions of its
      # dependencies. The pytest setting `pythonpath = ["."]` imports lbfgs from
      # the checkout.
      - run: >-
          uv run --isolated --no-project
          --with "numpy==1.24.*" --with "numba==0.60.*" --with pytest
          pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .
      - run: uvx ruff format --check .
